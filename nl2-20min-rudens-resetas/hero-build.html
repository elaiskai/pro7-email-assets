<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap");
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 600px;
        height: 430px;
        overflow: hidden;
        font-family: Montserrat, Arial, sans-serif;
      }
      .hero {
        position: relative;
        width: 600px;
        height: 430px;
        overflow: hidden;
        background: #f3f1e9;
        color: #171c22;
      }
      .green {
        position: absolute;
        right: -82px;
        top: -72px;
        width: 390px;
        height: 570px;
        background: #42bd7c;
        border-radius: 48% 0 0 48%;
        transform: rotate(5deg);
      }
      .ring {
        position: absolute;
        right: -54px;
        top: -35px;
        width: 340px;
        height: 500px;
        border: 2px solid rgba(255, 255, 255, 0.32);
        border-radius: 48% 0 0 48%;
        transform: rotate(5deg);
      }
      .copy {
        position: absolute;
        z-index: 5;
        left: 39px;
        top: 38px;
        width: 330px;
      }
      .tag {
        display: inline-block;
        background: #dff4e9;
        color: #237349;
        border-radius: 999px;
        padding: 8px 12px 7px;
        font-size: 10px;
        line-height: 12px;
        font-weight: 700;
        letter-spacing: 1.3px;
        text-transform: uppercase;
      }
      .kicker {
        margin-top: 21px;
        font-size: 13px;
        line-height: 16px;
        font-weight: 700;
        letter-spacing: 1.2px;
        text-transform: uppercase;
      }
      .number {
        margin-top: 28px;
        font-size: 101px;
        line-height: 91px;
        font-weight: 700;
        letter-spacing: -8px;
      }
      .number span {
        display: inline-block;
        margin-left: 8px;
        font-size: 22px;
        line-height: 24px;
        letter-spacing: 0;
      }
      .title {
        margin-top: 9px;
        width: 315px;
        font-size: 29px;
        line-height: 32px;
        font-weight: 700;
        letter-spacing: -1.1px;
      }
      .sub {
        margin-top: 14px;
        width: 275px;
        font-size: 13px;
        line-height: 19px;
        font-weight: 500;
        color: #50565b;
      }
      .cta {
        display: inline-block;
        margin-top: 20px;
        background: #171c22;
        color: #fff;
        border-radius: 7px;
        padding: 12px 17px;
        font-size: 12px;
        line-height: 15px;
        font-weight: 700;
      }
      .stage {
        position: absolute;
        z-index: 3;
        right: 2px;
        bottom: 15px;
        width: 300px;
        height: 350px;
        overflow: hidden;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 22px 38px rgba(18, 48, 33, 0.18);
      }
      .halo {
        display: none;
      }
      .product {
        position: absolute;
        z-index: 2;
        object-fit: contain;
        height: auto;
      }
      .p1 {
        width: 210px;
        left: -20px;
        top: 35px;
        clip-path: polygon(35% 4%,40% 3%,49% 2.8%,56% 3.5%,61% 6%,64% 10%,63% 12%,58% 14%,57% 16%,58% 24%,59% 31%,62% 44%,66% 59%,68% 70%,68.5% 79%,67% 88%,65% 95%,62% 96.5%,48% 97%,39% 96.5%,36.5% 94%,34% 86%,32.7% 78%,32.8% 71%,34% 65%,36% 58%,40% 51%,42% 46%,42% 42%,41% 38%,43% 35%,45% 32%,46.5% 27%,46.5% 23%,47% 16%,48% 15%,46% 14%,42% 14%,39% 18%,36% 21%,33% 22%,32% 21%,34% 18%,35% 16%,37% 14%,38% 12%,35% 12%,35% 11%,38% 10%,35% 9%);
      }
      .p2 {
        width: 210px;
        left: 70px;
        top: 25px;
        clip-path: polygon(36% 7%,42% 6%,50% 6%,57% 7%,61% 10%,63% 13%,62% 15%,58% 16%,57% 18%,58% 25%,59% 35%,62% 45%,65% 55%,67% 67%,67% 77%,65% 87%,63% 92%,61% 93%,49% 94%,39% 93.5%,37% 92%,35% 87%,33.5% 79%,33% 73%,34% 64%,36% 57%,39% 52%,41% 47%,42% 43%,41% 39%,41% 38%,44% 35%,46% 31%,47% 25%,47% 19%,48% 18%,43% 17%,42% 16%,39% 20%,36% 23%,34% 24%,33% 23%,35% 20%,36% 18%,38% 16%,40% 15%,36% 14%,36% 13%,39% 13%,36% 12%);
      }
      .p3 {
        width: 165px;
        left: 135px;
        top: 153px;
        z-index: 4;
        clip-path: polygon(43% 7%,48% 6.5%,53% 7%,54% 8%,54% 14%,55% 16%,57% 20%,59% 29%,61% 45%,65% 49%,68% 54%,69% 61%,69% 89%,68% 94%,65% 96%,50% 97%,35% 96%,31% 94%,29% 91%,29% 63%,30% 57%,33% 51%,39% 45%,40% 42%,40% 36%,41% 33%,40% 30%,41% 26%,40% 23%,41% 21%,41% 18%,43% 15%);
      }
      .p4 {
        width: 220px;
        left: 25px;
        top: 151px;
        z-index: 4;
        clip-path: polygon(38% 2%,48% 1%,56% 2%,61% 5%,62.5% 8%,62% 10%,57% 12%,56% 14%,57% 24%,58% 32%,60% 44%,63% 56%,65% 69%,66% 78%,65% 88%,63% 96%,60% 98%,48% 98.5%,39% 97%,37% 94%,35.5% 87%,35% 78%,35.5% 68%,37% 60%,40% 52%,42% 45%,43% 38%,42.5% 37%,43% 35%,46% 29%,47% 24%,47.5% 20%,48% 14%,48% 13%,44% 12%,42% 14%,40% 18%,37% 20%,35% 20%,36% 17%,38% 14%,40% 11%,41% 10%,38% 9%,38% 8%,41% 8%,38% 7%);
      }
      .badge {
        position: absolute;
        z-index: 6;
        right: 24px;
        top: 25px;
        width: 76px;
        height: 76px;
        border-radius: 50%;
        background: #171c22;
        color: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        font-size: 10px;
        line-height: 13px;
        font-weight: 700;
        transform: rotate(6deg);
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="green"></div>
      <div class="ring"></div>
      <div class="copy">
        <div class="tag">Namams šį rudenį</div>
        <div class="number">20<span>MIN.</span></div>
        <div class="title">Greitas rudens apsitvarkymas.</div>
        <div class="sub">
          Keturios priemonės tam, kas rudenį susitepa greičiausiai.
        </div>
        <div class="cta">ŽIŪRĖTI PRIEMONES&nbsp; →</div>
      </div>
      <div class="stage">
        <div class="halo"></div>
        <img class="product p1" src="assets/super-cleaner.png" /><img
          class="product p2"
          src="assets/kitchen-degreaser.png"
        /><img class="product p3" src="assets/floor-cleaner-citrus.png" />
        <img class="product p4" src="assets/glass-mirror-750.png" alt="Americol Glass &amp; Mirror, 750 ml" />
      </div>
      <div class="badge">PRO7<br />RUDENS<br />RESETAS</div>
    </div>
  </body>
</html>
